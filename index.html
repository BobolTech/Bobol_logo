<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bobol Technologies - Tu Negocio Digital</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            min-height: 100dvh;
            overflow: hidden;
            color: #ffffff;
        }
        .phone-container {
            width: 100%;
            max-width: 410px;
            height: 100dvh;
            max-height: 100dvh;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 0px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }
        @media (min-width: 450px) {
            .phone-container { border-radius: 36px; height: 85vh; max-height: 840px; }
        }
        #bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .content-wrapper {
            position: relative; z-index: 2; flex: 1;
            display: flex; flex-direction: column;
            padding: 18px 20px;
            overflow: hidden;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-shrink: 0; }
        .logo { font-size: 1.05rem; font-weight: 800; background: linear-gradient(135deg, #00ffcc, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .step-indicator { font-size: 0.8rem; color: #94a3b8; background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .screen-body { flex: 1; display: flex; flex-direction: column; justify-content: center; animation: fadeIn 0.3s ease-in-out; overflow: hidden; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        h1 { font-size: 1.35rem; line-height: 1.2; margin-bottom: 10px; font-weight: 700; color: #f8fafc; }
        p { font-size: 0.88rem; line-height: 1.4; color: #cbd5e1; margin-bottom: 8px; }
        .highlight-box { background: rgba(0,0,0,0.45); border-left: 4px solid #00ffcc; padding: 9px 12px; border-radius: 0 8px 8px 0; margin: 8px 0; font-size: 0.82rem; }
        .grid-features { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
        .feature-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 10px; text-align: center; }
        .feature-card h3 { font-size: 0.82rem; color: #00ffcc; margin-bottom: 2px; }
        .feature-card p { font-size: 0.7rem; margin: 0; color: #94a3b8; }
        .footer-nav { display: flex; gap: 10px; margin-top: auto; padding-top: 10px; flex-shrink: 0; }
        button { flex: 1; padding: 12px 16px; border-radius: 12px; border: none; font-weight: 600; font-size: 0.92rem; cursor: pointer; transition: all 0.2s ease; }
        .btn-back { background: rgba(255,255,255,0.1); color: #ffffff; border: 1px solid rgba(255,255,255,0.15); }
        .btn-next { background: linear-gradient(135deg, #00ffcc, #0077ff); color: #0b0f19; box-shadow: 0 4px 15px rgba(0,255,204,0.3); }
        .btn-whatsapp { background: linear-gradient(135deg, #25d366, #128c7e); color: #ffffff; box-shadow: 0 4px 15px rgba(37,211,102,0.4); width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="phone-container">
        <canvas id="bgCanvas"></canvas>
        <div class="content-wrapper">
            <div class="header">
                <div class="logo">Bobol Technologies</div>
                <div class="step-indicator" id="stepIndicator">Pantalla 1/5</div>
            </div>
            <div class="screen-body" id="screenContent"></div>
            <div class="footer-nav" id="footerNav"></div>
        </div>
    </div>
<script>
        const screens = [
            { title: "¡Es hora de independizarte y promocionarte con tu propia plataforma!", content: `<p>Las grandes apps de entrega se quedan hasta con el 30% de tus ventas. ¡No regales tu esfuerzo!</p><div class="highlight-box"><b>Para todo tipo de negocios:</b> Ideal para fondas, restaurantes, <b>jardineros, mecánicos, personas que lavan carros</b> y más.</div><p>Ten tu propio menú digital inteligente conectado directo a tu WhatsApp.</p>` },
            { title: "Cero comisiones. Ahorro real vs Uber Eats o Didi Foods", content: `<p>Mientras otros te cobran comisión por cada cliente, con nosotros tus ganancias son íntegras para ti.</p><div class="highlight-box"><b>Inversión transparente:</b><br>• Tu propio menú digital desde: <b>(Promoción anual) $2,999 MXN</b>.<br>• Mantenimiento / Actualizaciones desde: <b>$150 MXN</b> (¡Planes mensuales desde $500 al mes!).</div><p style="font-size:0.8rem; color:#94a3b8;">Un costo mínimo que se paga solo con un par de servicios al mes.</p>` },
            { title: "Estructura perfecta para tus servicios o productos", content: `<p>Organiza tu catálogo exactamente como lo necesitas para impresionar a tus clientes:</p><div class="grid-features"><div class="feature-card"><h3>3 a 5 Categorías</h3><p>Secciones claras y ordenadas.</p></div><div class="feature-card"><h3>5 Productos c/u</h3><p>Imágenes reales de lo que vendes.</p></div><div class="feature-card"><h3>Tu Propio Logo</h3><p>Identidad 100% de tu negocio.</p></div><div class="feature-card"><h3>Fotos Propias</h3><p>Muestra tu calidad exacta.</p></div></div>` },
            { title: "Fondos Vivos y Estacionales adaptados a tu gusto", content: `<p>Dale vida fresca a tu menú digital cambiando los fondos animados según la época del año:</p><div class="grid-features"><div class="feature-card"><h3>Estaciones</h3><p>Primavera, Verano, Otoño, Invierno.</p></div><div class="feature-card"><h3>Fechas Especiales</h3><p>14 de Febrero, Día de las Madres, Navidad...</p></div></div><p style="font-size: 0.8rem; margin-top: 6px;">¡O el diseño personalizado que prefieras!</p>` },
            { title: "Control total de entregas y pagos directo a WhatsApp", content: `<p>Tú decides cómo trabajas y operas tu negocio cada día:</p><div class="highlight-box">• <b>Servicio a domicilio:</b> Actívalo o desactívalo a voluntad.<br>• <b>Formas de pago:</b> Efectivo o transferencia.<br>• <b>Pedidos automáticos:</b> Todo llega ordenado directo a tu WhatsApp.</div><p style="font-weight: 600; color: #00ffcc; text-align: center; margin-top: 2px;">¿Te interesa digitalizar tu negocio hoy?</p>` }
        ];
        let currentScreen = 0;
        const canvas = document.getElementById('bgCanvas'); const ctx = canvas.getContext('2d'); let width, height;
        function resize() { width = canvas.width = canvas.offsetWidth; height = canvas.height = canvas.offsetHeight; }
        window.addEventListener('resize', resize); resize();
        let drops = []; const themes = [['#ffe600','#ff9900'],['#999999','#444444'],['#cc66ff','#6600cc'],['#ff6600','#cc3300'],['#ff3333','#990000'],['#00cc66','#006633']];
        function initDrops() { drops = []; for (let i=0;i<18;i++) { drops.push({ x: Math.random()*width, y: Math.random()*height, size: Math.random()*12+10, speedY: (Math.random()*0.8+0.3)*(Math.random()<0.5?1:-1), speedX: (Math.random()*0.6-0.3), colors: themes[Math.floor(Math.random()*themes.length)], alpha: Math.random()*0.4+0.2 }); } }
        function drawScene() { ctx.clearRect(0,0,width,height); drops.forEach(d=>{ ctx.save(); ctx.globalAlpha=d.alpha; ctx.translate(d.x,d.y); ctx.beginPath(); ctx.moveTo(0,-d.size); ctx.bezierCurveTo(d.size*0.8,-d.size*0.2,d.size*0.8,d.size*0.8,0,d.size); ctx.bezierCurveTo(-d.size*0.8,d.size*0.8,-d.size*0.8,-d.size*0.2,0,-d.size); ctx.closePath(); let grad=ctx.createRadialGradient(-d.size*0.3,-d.size*0.3,2,0,0,d.size); grad.addColorStop(0,d.colors[0]); grad.addColorStop(1,d.colors[1]); ctx.fillStyle=grad; ctx.fill(); ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(-d.size*0.25,0,d.size*0.12,0,Math.PI*2); ctx.arc(d.size*0.25,0,d.size*0.12,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-d.size*0.28,-d.size*0.03,d.size*0.04,0,Math.PI*2); ctx.arc(d.size*0.22,-d.size*0.03,d.size*0.04,0,Math.PI*2); ctx.fill(); ctx.restore(); d.y+=d.speedY; d.x+=d.speedX; if(d.y<-30)d.y=height+30; if(d.y>height+30)d.y=-30; if(d.x<-30)d.x=width+30; if(d.x>width+30)d.x=-30; }); requestAnimationFrame(drawScene); }
        function renderScreen() { const data=screens[currentScreen]; document.getElementById('stepIndicator').innerText=`Pantalla ${currentScreen+1}/${screens.length}`; document.getElementById('screenContent').innerHTML=`<div><h1>${data.title}</h1>${data.content}</div>`; const nav=document.getElementById('footerNav'); if(currentScreen===screens.length-1){ nav.innerHTML=`<button class="btn-back" onclick="prevScreen()">Atrás</button><a href="https://wa.me/525652677560?text=Hola,%20me%20interesa%20tener%20mi%20plataforma%20con%20Bobol%20Technologies" target="_blank" class="btn-whatsapp">¿Te interesa? ¡Escríbeme!</a>`; } else if(currentScreen===0){ nav.innerHTML=`<button class="btn-next" onclick="nextScreen()">Siguiente</button>`; } else { nav.innerHTML=`<button class="btn-back" onclick="prevScreen()">Atrás</button><button class="btn-next" onclick="nextScreen()">Siguiente</button>`; } }
        function nextScreen(){ if(currentScreen<screens.length-1){ currentScreen++; renderScreen(); } }
        function prevScreen(){ if(currentScreen>0){ currentScreen--; renderScreen(); } }
        initDrops(); renderScreen(); drawScene();
</script>
</body>
</html>
